name: Build Android (ABI report)
on: workflow_dispatch

env:
  HAXE_VER: 4.3.7

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VER }}
      - name: Libraries
        run: |
          chmod +x ./setup/mobile.sh
          sh ./setup/mobile.sh
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
          haxelib run lime rebuild hxcpp --quiet
      - name: Configure
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: Compile
        run: haxelib run lime build android -release
      - name: ABI report
        if: always()
        run: |
          APK=$(ls export/release/android/bin/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          { echo "### APK: $(du -h "$APK" 2>/dev/null | cut -f1)"; echo
            for A in armeabi-v7a arm64-v8a x86 x86_64; do
              echo "- $A: $(unzip -l "$APK" 2>/dev/null | grep -c "lib/$A/") файлів"
            done
            echo; echo "libvlc:"; unzip -l "$APK" 2>/dev/null | grep libvlc || echo "відсутній"
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
